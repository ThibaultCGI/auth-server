spring.application.name=auth-server

spring.datasource.url=${env.spring.datasource.url}
spring.datasource.username=${env.spring.datasource.username}
spring.datasource.password=${env.spring.datasource.password}

spring.jpa.properties.hibernate.default_schema=auth_server
spring.jpa.show-sql=${env.spring.jpa.show-sql:false}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.default-schema=auth_server
spring.liquibase.change-log=classpath:db/changelog/changelog.xml

test-resource-server.url=${env.test-resource-server.url}
cors.allowed-origins=${test-resource-server.url}

springdoc.api-docs.enabled=${env.springdoc.api-docs.enabled}
springdoc.swagger-ui.enabled=${env.springdoc.swagger-ui.enabled}
